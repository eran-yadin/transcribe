name: release

# Publishes ghcr.io/eran-yadin/transcribe on a vX.Y.Z tag.
#
# Deliberately no `latest` tag. The homelab catalog pins an exact version, and a
# floating tag on a stateful app means an unattended update can move the app
# under its own database.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # metadata-action's default flavor (latest=auto) adds a `latest` tag
          # on any semver push, which is exactly the floating tag this is
          # avoiding. Asking for specific tags does not switch it off.
          flavor: latest=false
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
